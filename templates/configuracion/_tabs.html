{# Pestañas de la configuración — se incluye en empresa.html y facturacion.html #}
<nav class="bg-white rounded-xl shadow-sm border mb-6 flex">
  {% set ep = request.endpoint %}
  <a href="{{ url_for('configuracion.empresa') }}"
     class="flex-1 text-center py-3 px-4 font-medium text-sm
            {% if ep == 'configuracion.empresa' %}
              bg-indigo-50 text-indigo-700 border-b-2 border-indigo-600 rounded-t-xl
            {% else %}
              text-slate-600 hover:bg-slate-50
            {% endif %}">
    🏢 Empresa
  </a>
  <a href="{{ url_for('configuracion.facturacion') }}"
     class="flex-1 text-center py-3 px-4 font-medium text-sm
            {% if ep == 'configuracion.facturacion' %}
              bg-indigo-50 text-indigo-700 border-b-2 border-indigo-600 rounded-t-xl
            {% else %}
              text-slate-600 hover:bg-slate-50
            {% endif %}">
    🧾 Facturación / SAR
  </a>
</nav>
