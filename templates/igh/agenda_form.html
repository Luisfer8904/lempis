{% extends "igh/_layout.html" %}
{% block title %}{{ 'Editar' if item else 'Nueva' }} actividad IVG{% endblock %}
{% block heading %}{{ 'Editar actividad' if item else 'Nueva actividad' }}{% endblock %}

{% block actions %}
<a href="{{ url_for('igh.agenda') }}" class="text-slate-600 hover:text-slate-900 text-sm">
  ← Volver
</a>
{% endblock %}

{% block content %}
<form method="POST" class="bg-white p-6 rounded-xl shadow-sm border max-w-4xl">
  <div class="grid md:grid-cols-2 gap-4">
    <div class="md:col-span-2">
      <label class="block text-sm font-medium mb-1">Título *</label>
      <input name="title" required value="{{ item.title if item else '' }}"
             class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Cliente asociado</label>
      <select name="client_id" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
        <option value="">Sin cliente específico</option>
        {% for client_item in clients %}
          <option value="{{ client_item.id }}" {% if item and item.client_id == client_item.id %}selected{% endif %}>
            {{ client_item.name }}
          </option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Fecha programada *</label>
      <input type="datetime-local" name="scheduled_for"
             value="{{ item.scheduled_for.strftime('%Y-%m-%dT%H:%M') if item and item.scheduled_for else '' }}"
             class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Tipo de actividad</label>
      <select name="activity_type" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
        {% for code, label in [('seguimiento', 'Seguimiento'), ('cobro', 'Cobro'), ('visita', 'Visita'), ('llamada', 'Llamada')] %}
          <option value="{{ code }}" {% if (item and item.activity_type == code) or (not item and code == 'seguimiento') %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Prioridad</label>
      <select name="priority" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
        {% for code, label in [('baja', 'Baja'), ('media', 'Media'), ('alta', 'Alta')] %}
          <option value="{{ code }}" {% if (item and item.priority == code) or (not item and code == 'media') %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Estado</label>
      <select name="status" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
        {% for code, label in [('pendiente', 'Pendiente'), ('en_proceso', 'En proceso'), ('completada', 'Completada'), ('cancelada', 'Cancelada')] %}
          <option value="{{ code }}" {% if (item and item.status == code) or (not item and code == 'pendiente') %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div></div>

    <div class="md:col-span-2">
      <label class="block text-sm font-medium mb-1">Notas</label>
      <textarea name="notes" rows="4"
                class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">{{ item.notes if item else '' }}</textarea>
    </div>
  </div>

  <div class="flex gap-3 mt-6 pt-6 border-t">
    <button class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">
      {{ 'Guardar cambios' if item else 'Crear actividad' }}
    </button>
    <a href="{{ url_for('igh.agenda') }}"
       class="border px-6 py-2 rounded-lg hover:bg-slate-50">Cancelar</a>
  </div>
</form>
{% endblock %}
