{% extends "base.html" %}
{% block title %}Crear cuenta — {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm">
  <h1 class="text-2xl font-bold mb-6 text-center">Crea tu cuenta</h1>

  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Nombre de la empresa</label>
      <input name="company" required
             class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Tu nombre completo</label>
      <input name="full_name" required
             class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Correo</label>
      <input type="email" name="email" required
             class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Contraseña</label>
      <input type="password" name="password" required minlength="8"
             class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">País</label>
      <select name="country_code"
              class="w-full px-3 py-2 border rounded-lg">
        <option value="HN">Honduras</option>
        <option value="GT">Guatemala</option>
        <option value="SV">El Salvador</option>
        <option value="NI">Nicaragua</option>
        <option value="CR">Costa Rica</option>
        <option value="PA">Panamá</option>
        <option value="MX">México</option>
        <option value="CO">Colombia</option>
        <option value="PE">Perú</option>
      </select>
    </div>

    <button class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">
      Crear cuenta gratis
    </button>
  </form>

  <p class="text-sm text-center mt-4 text-slate-500">
    ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}" class="text-indigo-600">Inicia sesión</a>
  </p>
</div>
{% endblock %}
