{% extends "base.html" %}
{% block title %}Recuperar contraseña — {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm">
  <h1 class="text-2xl font-bold mb-4 text-center">Recuperar contraseña</h1>
  <p class="text-slate-600 text-sm mb-6 text-center">
    Te enviaremos un enlace para restablecer tu contraseña.
  </p>

  <form method="POST" class="space-y-4">
    <input type="email" name="email" required placeholder="tu@correo.com"
           class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" />
    <button class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">
      Enviar enlace
    </button>
  </form>
</div>
{% endblock %}
